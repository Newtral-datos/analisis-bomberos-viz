<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flashover — etapas del desarrollo</title>
</head>
<body>
<div class="pb-flash">
  <div class="pb-flash__card">
    <div class="pb-flash__scenebox">
      <span class="pb-flash__corner pb-flash__corner--tl" aria-hidden="true"></span>
      <span class="pb-flash__corner pb-flash__corner--tr" aria-hidden="true"></span>
      <span class="pb-flash__corner pb-flash__corner--bl" aria-hidden="true"></span>
      <span class="pb-flash__corner pb-flash__corner--br" aria-hidden="true"></span>

      <div class="pb-flash__hud pb-flash__hud--tl" aria-hidden="true">
        <span class="pb-flash__rec"></span>TERMOGRAMA · SECCIÓN
      </div>
      <div class="pb-flash__hud pb-flash__hud--tr" aria-hidden="true">
        ESTADO <span id="pbFlashEstado" class="pb-flash__estado">ESTABLE</span>
      </div>

      <svg class="pb-flash__scene" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-label="Vista termografica de una seccion de habitacion mostrando las seis etapas del desarrollo de un flashover">
        <defs>
          <symbol id="pbFlameSimple" viewBox="0 0 20 31">
            <path fill="#ff4433" stroke="#0a0908" stroke-width="1" d="M10 2 C14 8 16 14 13 19 C17 17 19 13 18 9 C21 14 20 21 16 25 C18 24 20 21 20 21 C20 27 15 31 10 31 C5 31 0 27 0 21 C0 21 2 24 4 25 C0 21 -1 14 2 9 C1 13 3 17 7 19 C4 14 6 8 10 2 Z" />
            <path fill="#ffb319" transform="translate(3,4) scale(0.62)" d="M10 2 C14 8 16 14 13 19 C17 17 19 13 18 9 C21 14 20 21 16 25 C18 24 20 21 20 21 C20 27 15 31 10 31 C5 31 0 27 0 21 C0 21 2 24 4 25 C0 21 -1 14 2 9 C1 13 3 17 7 19 C4 14 6 8 10 2 Z" />
            <path fill="#fff6d8" transform="translate(5,10) scale(0.34)" d="M10 2 C14 8 16 14 13 19 C17 17 19 13 18 9 C21 14 20 21 16 25 C18 24 20 21 20 21 C20 27 15 31 10 31 C5 31 0 27 0 21 C0 21 2 24 4 25 C0 21 -1 14 2 9 C1 13 3 17 7 19 C4 14 6 8 10 2 Z" />
          </symbol>

          <linearGradient id="pbThermalGrad" x1="0" y1="1" x2="0" y2="0">
            <stop id="pbTgStop0" offset="0%"   stop-color="#0a0908" />
            <stop id="pbTgStop1" offset="33%"  stop-color="#0a0908" />
            <stop id="pbTgStop2" offset="66%"  stop-color="#0a0908" />
            <stop id="pbTgStop3" offset="100%" stop-color="#0a0908" />
          </linearGradient>

          <radialGradient id="pbFlashGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ff8a24" stop-opacity="0.6" />
            <stop offset="100%" stop-color="#ff8a24" stop-opacity="0" />
          </radialGradient>

          <linearGradient id="pbSofaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#413b30" />
            <stop offset="100%" stop-color="#241f1a" />
          </linearGradient>
          <radialGradient id="pbScorchGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#050403" stop-opacity="0.95" />
            <stop offset="55%" stop-color="#1c1410" stop-opacity="0.6" />
            <stop offset="100%" stop-color="#1c1410" stop-opacity="0" />
          </radialGradient>

          <marker id="pbArrowCool" viewBox="0 0 10 10" refX="8" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 Z" fill="#5fb3d9" />
          </marker>
          <marker id="pbArrowAmber" viewBox="0 0 10 10" refX="8" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 Z" fill="#ffb319" />
          </marker>
          <marker id="pbArrowDim" viewBox="0 0 10 10" refX="8" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 Z" fill="#8f8777" />
          </marker>
        </defs>

        <!-- habitacion -->
        <line x1="60" y1="56" x2="900" y2="56" stroke="#4a463e" stroke-width="2.5" />
        <line x1="60" y1="330" x2="900" y2="330" stroke="#4a463e" stroke-width="2.5" />
        <line x1="60" y1="56" x2="60" y2="330" stroke="#4a463e" stroke-width="2.5" />
        <line x1="900" y1="56" x2="900" y2="190" stroke="#4a463e" stroke-width="2.5" />
        <!-- marco de la puerta (unico hueco de ventilacion) -->
        <line x1="900" y1="190" x2="930" y2="190" stroke="#4a463e" stroke-width="2.5" />

        <!-- sofa: foco de incendio -->
        <g>
          <!-- patas -->
          <rect x="148" y="296" width="6" height="11" fill="#1c1a16" />
          <rect x="286" y="296" width="6" height="11" fill="#1c1a16" />
          <!-- reposabrazos -->
          <rect x="130" y="246" width="24" height="58" rx="8" fill="url(#pbSofaGrad)" stroke="#4a463e" stroke-width="2" />
          <rect x="286" y="246" width="24" height="58" rx="8" fill="url(#pbSofaGrad)" stroke="#4a463e" stroke-width="2" />
          <!-- respaldo -->
          <rect x="150" y="240" width="140" height="34" rx="10" fill="url(#pbSofaGrad)" stroke="#4a463e" stroke-width="2" />
          <path d="M158 246 Q220 240 282 246" stroke="#5a5443" stroke-width="1" fill="none" opacity="0.5" />
          <!-- asiento (tres cojines) -->
          <rect x="150" y="270" width="140" height="27" rx="8" fill="url(#pbSofaGrad)" stroke="#4a463e" stroke-width="2" />
          <path d="M156 275 Q220 270 284 275" stroke="#5a5443" stroke-width="1" fill="none" opacity="0.5" />
          <line x1="196" y1="272" x2="196" y2="295" stroke="#4a463e" stroke-width="1.2" opacity="0.6" />
          <line x1="243" y1="272" x2="243" y2="295" stroke="#4a463e" stroke-width="1.2" opacity="0.6" />
          <!-- mancha de chamuscado: crece y se oscurece con cada etapa, justo donde prende el foco -->
          <ellipse id="pbScorch" cx="220" cy="246" rx="6" ry="4" fill="url(#pbScorchGrad)" opacity="0" />
        </g>

        <!-- flechas de aire frio entrando / gases calientes subiendo (etapas 1-3) -->
        <g id="pbFlashArrows" stroke="#5fb3d9" stroke-width="2.5" fill="none" stroke-linecap="round">
          <path d="M110 315 L110 296" marker-end="url(#pbArrowCool)" />
          <path d="M850 315 L850 296" marker-end="url(#pbArrowCool)" />
          <path d="M248 236 L248 154" stroke="#ffb319" marker-end="url(#pbArrowAmber)" />
          <text x="100" y="350" font-size="13" stroke="none" fill="#5fb3d9" font-weight="700" text-anchor="middle">Aire</text>
          <text x="840" y="350" font-size="13" stroke="none" fill="#5fb3d9" font-weight="700" text-anchor="middle">Aire</text>
        </g>

        <!-- colchón de gases: degradado termico real, altura y "calor" controlados por JS -->
        <rect id="pbGasLayer" x="60" y="56" width="840" height="54" fill="url(#pbThermalGrad)" opacity="0.94" />
        <line id="pbPlanoNeutro" x1="60" y1="110" x2="900" y2="110" stroke="#01f3b3" stroke-width="1.5" stroke-dasharray="7 6" opacity="0.8" />
        <text id="pbPlanoNeutroLabel" x="66" y="105" font-size="13" letter-spacing="0.08em" fill="#01f3b3" font-weight="700" opacity="0.9">PLANO NEUTRO</text>

        <!-- llama base (foco inicial), crece con las etapas -->
        <g id="pbFlameBase" transform="translate(220,234) scale(1)" style="transform-box: fill-box; transform-origin: 50% 100%;">
          <g class="pb-flash__flicker">
            <path transform="translate(-10,-31)" fill="#ff4433" stroke="#0a0908" stroke-width="1" d="M10 2 C14 8 16 14 13 19 C17 17 19 13 18 9 C21 14 20 21 16 25 C18 24 20 21 20 21 C20 27 15 31 10 31 C5 31 0 27 0 21 C0 21 2 24 4 25 C0 21 -1 14 2 9 C1 13 3 17 7 19 C4 14 6 8 10 2 Z" />
            <path transform="translate(-10,-24) scale(0.68)" fill="#ffb319" d="M10 2 C14 8 16 14 13 19 C17 17 19 13 18 9 C21 14 20 21 16 25 C18 24 20 21 20 21 C20 27 15 31 10 31 C5 31 0 27 0 21 C0 21 2 24 4 25 C0 21 -1 14 2 9 C1 13 3 17 7 19 C4 14 6 8 10 2 Z" />
            <path transform="translate(-9,-15) scale(0.4)" fill="#fff6d8" d="M10 2 C14 8 16 14 13 19 C17 17 19 13 18 9 C21 14 20 21 16 25 C18 24 20 21 20 21 C20 27 15 31 10 31 C5 31 0 27 0 21 C0 21 2 24 4 25 C0 21 -1 14 2 9 C1 13 3 17 7 19 C4 14 6 8 10 2 Z" />
          </g>
        </g>

        <!-- ignición del colchón: fila de llamas justo bajo el plano neutro (etapas 4-6) -->
        <g id="pbCeilingFlames" opacity="0" style="transform: translate(0px, 110px);">
          <use href="#pbFlameSimple" class="pb-flash__miniflame pb-flash__flicker" x="150" y="-16" width="16" height="25" />
          <use href="#pbFlameSimple" class="pb-flash__miniflame pb-flash__flicker" x="260" y="-18" width="18" height="28" style="animation-delay:.1s" />
          <use href="#pbFlameSimple" class="pb-flash__miniflame pb-flash__flicker" x="370" y="-15" width="15" height="23" style="animation-delay:.2s" />
          <use href="#pbFlameSimple" class="pb-flash__miniflame pb-flash__flicker" x="470" y="-17" width="17" height="26" style="animation-delay:.3s" />
          <use href="#pbFlameSimple" class="pb-flash__miniflame pb-flash__flicker" x="570" y="-16" width="16" height="25" style="animation-delay:.15s" />
          <use href="#pbFlameSimple" class="pb-flash__miniflame pb-flash__flicker" x="670" y="-18" width="18" height="28" style="animation-delay:.25s" />
          <use href="#pbFlameSimple" class="pb-flash__miniflame pb-flash__flicker" x="770" y="-15" width="15" height="23" style="animation-delay:.05s" />
        </g>

        <!-- engulfment total: llamas extra en paredes/techo (etapa 6) -->
        <g id="pbFullEngulf" opacity="0">
          <use href="#pbFlameSimple" class="pb-flash__miniflame pb-flash__flicker" x="78" y="300" width="26" height="40" />
          <use href="#pbFlameSimple" class="pb-flash__miniflame pb-flash__flicker" x="760" y="296" width="24" height="37" style="animation-delay:.18s" />
          <use href="#pbFlameSimple" class="pb-flash__miniflame pb-flash__flicker" x="330" y="296" width="22" height="34" style="animation-delay:.08s" />
          <ellipse cx="480" cy="110" rx="420" ry="40" fill="url(#pbFlashGlow)" />
        </g>

        <!-- llamas y humo saliendo por la puerta (etapa 6) -->
        <g id="pbExterior" opacity="0">
          <use href="#pbFlameSimple" class="pb-flash__miniflame pb-flash__flicker" x="900" y="230" width="30" height="46" />
          <use href="#pbFlameSimple" class="pb-flash__miniflame pb-flash__flicker" x="918" y="245" width="22" height="34" style="animation-delay:.12s" />
          <g fill="#cdc6b6">
            <ellipse class="pb-flash__smoke pb-flash__smoke-1" cx="945" cy="140" rx="16" ry="11" />
            <ellipse class="pb-flash__smoke pb-flash__smoke-2" cx="945" cy="140" rx="16" ry="11" />
            <ellipse class="pb-flash__smoke pb-flash__smoke-3" cx="945" cy="140" rx="16" ry="11" />
          </g>
          <path d="M905 135 C 928 120, 942 135, 940 118" stroke="#8f8777" stroke-width="2" fill="none"
                stroke-linecap="round" marker-end="url(#pbArrowDim)" />
          <text x="955" y="163" font-size="14" letter-spacing="0.03em" fill="#8f8777" font-weight="600" text-anchor="end">Recirculación</text>
          <text x="955" y="180" font-size="14" letter-spacing="0.03em" fill="#8f8777" font-weight="600" text-anchor="end">del humo</text>
        </g>

        <!-- ficha de condiciones -->
        <g id="pbBadge" opacity="0">
          <rect id="pbBadgeBox" x="610" y="64" width="276" height="46" rx="3" fill="#0a0908" opacity="0.85" stroke="#01f3b3" stroke-width="1" />
          <text id="pbBadgeText" x="748" y="93" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="0.03em" fill="#f3ede2" font-weight="600" text-anchor="middle">—</text>
        </g>
      </svg>
    </div>

    <div class="pb-flash__caption">
      <button id="pbFlashPrev" class="pb-flash__navbtn" aria-label="Etapa anterior">&#8249;</button>
      <div class="pb-flash__textwrap">
        <p class="pb-flash__steplabel" id="pbFlashStepLabel">Etapa 1 / 6</p>
        <p class="pb-flash__title" id="pbFlashTitle">Foco inicial</p>
        <p class="pb-flash__desc" id="pbFlashDesc">—</p>
      </div>
      <button id="pbFlashNext" class="pb-flash__navbtn" aria-label="Etapa siguiente">&#8250;</button>
    </div>

    <div class="pb-flash__dots" id="pbFlashDots"></div>
  </div>
</div>

<style>
  .pb-flash {
    /* Tema de la escena (siempre oscuro — es una pantalla de camara termica, un fondo
       claro ahi no tendria sentido fisico): */
    --tc-void: #0a0908;
    --tc-dim: #9c9284;
    /* Tema de la tarjeta/pie (claro, igual que 01/02): */
    --pb-paper: #ffffff;
    --pb-ink: #1f2d2a;
    --pb-muted: #6b7a75;
    --pb-rule: #e3e8e6;
    --tc-accent: #01f3b3; /* color de marca — acento de toda la interfaz/HUD, nunca del fuego en si */
    --tc-red: #ff4433;
    box-sizing: border-box;
    max-width: 820px;
    margin: 0 auto;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .pb-flash * { box-sizing: border-box; }
  .pb-flash__mono {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  .pb-flash__card {
    position: relative;
    background: var(--pb-paper);
    border: 1px solid var(--pb-rule);
    border-radius: 3px;
    padding: 0;
    color: var(--pb-ink);
    box-shadow: 0 10px 30px rgba(31,45,42,0.12);
    overflow: hidden;
  }

  .pb-flash__scenebox {
    position: relative;
    width: 100%;
    aspect-ratio: 960 / 420;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255,179,25,0.05), transparent 65%),
      var(--tc-void);
  }
  .pb-flash__scenebox::after {
    /* vineta + textura de escaneado sutil, como el visor de una camara termica */
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
  }
  .pb-flash__scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  /* ── Marco de visor (esquinas tipo reticula) ── */
  .pb-flash__corner {
    position: absolute;
    width: 16px;
    height: 16px;
    z-index: 2;
    pointer-events: none;
  }
  .pb-flash__corner--tl { top: 9px; left: 9px; border-top: 2px solid var(--tc-accent); border-left: 2px solid var(--tc-accent); }
  .pb-flash__corner--tr { top: 9px; right: 9px; border-top: 2px solid var(--tc-accent); border-right: 2px solid var(--tc-accent); }
  .pb-flash__corner--bl { bottom: 9px; left: 9px; border-bottom: 2px solid var(--tc-accent); border-left: 2px solid var(--tc-accent); }
  .pb-flash__corner--br { bottom: 9px; right: 9px; border-bottom: 2px solid var(--tc-accent); border-right: 2px solid var(--tc-accent); }

  /* ── Etiquetas HUD ── */
  .pb-flash__hud {
    position: absolute;
    top: 14px;
    z-index: 2;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--tc-accent);
    display: flex;
    align-items: center;
    gap: 6px;
    text-shadow: 0 0 8px rgba(255,179,25,0.35);
  }
  .pb-flash__hud--tl { left: 30px; }
  .pb-flash__hud--tr { right: 30px; color: var(--tc-dim); }
  .pb-flash__estado {
    color: var(--tc-accent);
    transition: color 0.4s ease;
  }
  .pb-flash__estado.is-climax {
    color: var(--tc-red);
    text-shadow: 0 0 10px rgba(255,68,51,0.55);
  }
  .pb-flash__rec {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--tc-red);
    display: inline-block;
    animation: pbFlashRec 1.6s ease-in-out infinite;
  }

  #pbGasLayer stop { transition: stop-color 1.1s ease; }
  #pbGasLayer {
    transition: height 1.1s ease;
  }
  #pbPlanoNeutro, #pbPlanoNeutroLabel {
    transition: transform 1.1s ease;
  }
  #pbCeilingFlames {
    transition: opacity 0.9s ease, transform 1.1s ease;
  }
  #pbExterior, #pbFullEngulf, #pbFlashArrows {
    transition: opacity 0.8s ease;
  }
  #pbCo2, #pbBadge {
    transition: opacity 0.3s ease;
  }
  #pbBadgeBox {
    transition: stroke 0.3s ease;
  }
  #pbFlameBase {
    transition: transform 1s ease;
  }
  #pbScorch {
    transition: rx 1.1s ease, ry 1.1s ease, opacity 1.1s ease;
  }

  .pb-flash__flicker { animation: pbFlashFlicker 0.55s ease-in-out infinite; }
  .pb-flash__miniflame { transform-box: fill-box; transform-origin: 50% 100%; }

  .pb-flash__smoke { opacity: 0; }
  .pb-flash__smoke-1 { animation: pbFlashSmoke 3s ease-out infinite 0s; }
  .pb-flash__smoke-2 { animation: pbFlashSmoke 3s ease-out infinite 1s; }
  .pb-flash__smoke-3 { animation: pbFlashSmoke 3s ease-out infinite 2s; }

  @keyframes pbFlashFlicker {
    0%, 100% { transform: scaleY(1) scaleX(1) rotate(0deg); }
    50% { transform: scaleY(1.1) scaleX(0.94) rotate(-2deg); }
  }
  @keyframes pbFlashSmoke {
    0%   { opacity: 0.4; transform: translate(0, 0) scale(0.6); }
    100% { opacity: 0; transform: translate(14px, -34px) scale(1.8); }
  }
  @keyframes pbFlashRec {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  .pb-flash__caption {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px 18px;
    background: var(--pb-paper);
    border-top: 1px solid var(--pb-rule);
  }
  .pb-flash__textwrap { flex: 1 1 auto; min-width: 0; text-align: center; }
  .pb-flash__steplabel {
    margin: 0 0 5px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--tc-accent);
  }
  .pb-flash__title {
    margin: 0 0 5px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--pb-ink);
  }
  .pb-flash__desc {
    margin: 0;
    font-size: 9px;
    line-height: 1.4;
    color: var(--pb-muted);
  }

  .pb-flash__navbtn {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    border-radius: 3px;
    border: 1px solid var(--pb-rule);
    background: var(--pb-paper);
    color: var(--pb-ink);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .pb-flash__navbtn:hover { background: var(--tc-accent); border-color: var(--tc-accent); color: var(--tc-void); }

  .pb-flash__dots {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 0 0 14px;
    background: var(--pb-paper);
  }
  .pb-flash__dot {
    width: 7px;
    height: 7px;
    border-radius: 1px;
    border: none;
    background: var(--pb-rule);
    cursor: pointer;
    padding: 0;
    transition: background 0.3s ease, transform 0.3s ease;
  }
  .pb-flash__dot.is-active {
    background: var(--tc-accent);
    transform: scale(1.3);
  }
  .pb-flash__dot.is-active.is-climax {
    background: var(--tc-red);
  }

  @media (max-width: 480px) {
    .pb-flash__hud { font-size: 7.5px; }
    .pb-flash__hud--tl { left: 28px; }
    .pb-flash__hud--tr { right: 28px; }
    .pb-flash__caption { padding: 14px 14px 16px; }
    .pb-flash__title { font-size: 14px; }
    .pb-flash__desc { font-size: 8.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pb-flash__flicker, .pb-flash__smoke-1, .pb-flash__smoke-2, .pb-flash__smoke-3, .pb-flash__rec {
      animation: none;
    }
  }
</style>

<script>
  (function () {
    var CEILING_Y = 56;

    // Rampa termica real (negro -> purpura -> magenta/rojo -> naranja -> ambar -> blanco
    // incandescente), igual que la paleta de una camara termica de bomberos (TIC). Cada
    // etapa define que tramo de esta rampa ocupa el colchon de gases (abajo = mas frio,
    // arriba = mas caliente), en vez de un color solido por etapa.
    var RAMPA_TERMICA = [
      [0.00, "#0a0908"],
      [0.20, "#241233"],
      [0.42, "#7a1f5e"],
      [0.60, "#d6342a"],
      [0.78, "#ff8a24"],
      [0.90, "#ffc84a"],
      [1.00, "#fff6d8"],
    ];
    function hexARgb(hex) {
      hex = hex.replace("#", "");
      return [parseInt(hex.slice(0, 2), 16), parseInt(hex.slice(2, 4), 16), parseInt(hex.slice(4, 6), 16)];
    }
    function rgbAHex(r, g, b) {
      return "#" + [r, g, b].map(function (v) {
        return Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0");
      }).join("");
    }
    function muestrearRampa(t) {
      t = Math.max(0, Math.min(1, t));
      for (var i = 1; i < RAMPA_TERMICA.length; i++) {
        var t0 = RAMPA_TERMICA[i - 1][0], t1 = RAMPA_TERMICA[i][0];
        if (t <= t1) {
          var f = (t - t0) / (t1 - t0 || 1);
          var c0 = hexARgb(RAMPA_TERMICA[i - 1][1]), c1 = hexARgb(RAMPA_TERMICA[i][1]);
          return rgbAHex(
            c0[0] + (c1[0] - c0[0]) * f,
            c0[1] + (c1[1] - c0[1]) * f,
            c0[2] + (c1[2] - c0[2]) * f
          );
        }
      }
      return RAMPA_TERMICA[RAMPA_TERMICA.length - 1][1];
    }

    // Cada etapa corresponde a un momento del apartado 6.1 del PDF (paginas 43-46):
    // 1) desarrollo de la columna de gases, 2) colchón de gases en el techo, 3) enriquecimiento
    // del colchón / descenso del plano neutro, 4) ignición del colchón al alcanzarlo las llamas,
    // 5) combustion del CO (CO + O2 -> CO2), 6) flashover (todas las superficies arden).
    var ETAPAS = [
      {
        titulo: "Foco inicial",
        desc: "El fuego se desarrolla en las partes bajas del recinto. Los gases no quemados se elevan hacia el techo formando una columna de gases.",
        gasBottomY: 110, heatBottom: 0.02, heatTop: 0.16, flameScale: 0.55, estado: "ESTABLE",
        scorchRx: 6, scorchRy: 4, scorchOp: 0.3,
        arrows: 1, ceilingFlames: 0, badge: null, exterior: 0, fullEngulf: 0,
      },
      {
        titulo: "Formación del colchón de gases",
        desc: "La columna de gases llega al techo y se extiende, formando un colchón de gases calientes. Aumentan la temperatura y la concentración de gases.",
        gasBottomY: 150, heatBottom: 0.08, heatTop: 0.30, flameScale: 0.72, estado: "EN DESARROLLO",
        scorchRx: 13, scorchRy: 7, scorchOp: 0.45,
        arrows: 1, ceilingFlames: 0, badge: null, exterior: 0, fullEngulf: 0,
      },
      {
        titulo: "El colchón se enriquece",
        desc: "La mezcla se acerca a su límite inferior de inflamabilidad. El plano neutro desciende y el recinto se calienta.",
        gasBottomY: 195, heatBottom: 0.16, heatTop: 0.48, flameScale: 0.85, estado: "ENRIQUECIDO",
        scorchRx: 22, scorchRy: 11, scorchOp: 0.55,
        arrows: 0.4, ceilingFlames: 0, badge: null, exterior: 0, fullEngulf: 0,
      },
      {
        titulo: "Ignición del colchón de gases",
        desc: "Las llamas alcanzan la parte inferior del colchón: se inflama justo ahí, aumentando la radiación de calor sobre el resto del recinto.",
        gasBottomY: 225, heatBottom: 0.30, heatTop: 0.70, flameScale: 1, estado: "PRE-IGNICIÓN",
        scorchRx: 34, scorchRy: 17, scorchOp: 0.68,
        arrows: 0, ceilingFlames: 1, badge: "Pre-flashover · 500-650 °C", exterior: 0, fullEngulf: 0,
      },
      {
        titulo: "Reacción en cadena",
        desc: "El monóxido de carbono de los gases no quemados se oxida con el oxígeno del aire, liberando aún más calor.",
        gasBottomY: 245, heatBottom: 0.44, heatTop: 0.86, flameScale: 1, estado: "CRÍTICO",
        scorchRx: 48, scorchRy: 22, scorchOp: 0.78,
        arrows: 0, ceilingFlames: 1, badge: null, exterior: 0, fullEngulf: 0,
      },
      {
        titulo: "FLASHOVER",
        desc: "Transición rápida: todas las superficies combustibles del recinto arden a la vez. Temperatura > 483 °C. El humo recircula hacia el exterior.",
        gasBottomY: 270, heatBottom: 0.60, heatTop: 1.00, flameScale: 1, estado: "FLASHOVER", climax: true,
        scorchRx: 78, scorchRy: 30, scorchOp: 0.9,
        arrows: 0, ceilingFlames: 1, badge: "FLASHOVER · 500-650 °C", exterior: 1, fullEngulf: 1,
      },
    ];

    var AUTOPLAY_MS = 4200;

    var gasLayer = document.getElementById("pbGasLayer");
    var tgStops = [
      document.getElementById("pbTgStop0"),
      document.getElementById("pbTgStop1"),
      document.getElementById("pbTgStop2"),
      document.getElementById("pbTgStop3"),
    ];
    var planoNeutro = document.getElementById("pbPlanoNeutro");
    var planoNeutroLabel = document.getElementById("pbPlanoNeutroLabel");
    var flameBase = document.getElementById("pbFlameBase");
    var scorch = document.getElementById("pbScorch");
    var ceilingFlames = document.getElementById("pbCeilingFlames");
    var fullEngulf = document.getElementById("pbFullEngulf");
    var exterior = document.getElementById("pbExterior");
    var arrows = document.getElementById("pbFlashArrows");
    var badge = document.getElementById("pbBadge");
    var badgeBox = document.getElementById("pbBadgeBox");
    var badgeText = document.getElementById("pbBadgeText");
    var estadoEl = document.getElementById("pbFlashEstado");

    var stepLabelEl = document.getElementById("pbFlashStepLabel");
    var titleEl = document.getElementById("pbFlashTitle");
    var descEl = document.getElementById("pbFlashDesc");
    var dotsEl = document.getElementById("pbFlashDots");
    var prevBtn = document.getElementById("pbFlashPrev");
    var nextBtn = document.getElementById("pbFlashNext");
    var card = document.querySelector(".pb-flash__card");

    var dots = ETAPAS.map(function (_, i) {
      var dot = document.createElement("button");
      dot.className = "pb-flash__dot";
      dot.setAttribute("aria-label", "Ir a la etapa " + (i + 1));
      dot.addEventListener("click", function () { irAEtapa(i, true); });
      dotsEl.appendChild(dot);
      return dot;
    });

    var indice = 0;
    var reduceMotion = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function aplicarEtapa(i) {
      var e = ETAPAS[i];
      var altura = e.gasBottomY - CEILING_Y;

      gasLayer.style.setProperty("height", altura);
      [0, 1, 2, 3].forEach(function (k) {
        var t = e.heatBottom + (e.heatTop - e.heatBottom) * (k / 3);
        tgStops[k].style.setProperty("stop-color", muestrearRampa(t));
      });

      planoNeutro.style.setProperty("transform", "translateY(" + (e.gasBottomY - 110) + "px)");
      planoNeutroLabel.style.setProperty("transform", "translateY(" + (e.gasBottomY - 110) + "px)");

      flameBase.setAttribute(
        "transform",
        "translate(220,234) scale(" + e.flameScale + ")"
      );

      scorch.style.setProperty("rx", e.scorchRx);
      scorch.style.setProperty("ry", e.scorchRy);
      scorch.style.setProperty("opacity", e.scorchOp);

      ceilingFlames.style.setProperty("transform", "translate(0px, " + e.gasBottomY + "px)");
      ceilingFlames.style.setProperty("opacity", e.ceilingFlames);
      fullEngulf.style.setProperty("opacity", e.fullEngulf);
      exterior.style.setProperty("opacity", e.exterior);
      arrows.style.setProperty("opacity", e.arrows);

      if (e.badge) {
        badge.style.setProperty("opacity", 1);
        badgeText.textContent = e.badge;
        badgeBox.style.setProperty("stroke", e.climax ? "#ff4433" : "#01f3b3");
      } else {
        badge.style.setProperty("opacity", 0);
      }

      estadoEl.textContent = e.estado;
      estadoEl.classList.toggle("is-climax", !!e.climax);

      stepLabelEl.textContent = "Etapa " + (i + 1) + " / " + ETAPAS.length;
      titleEl.textContent = e.titulo;
      descEl.textContent = e.desc;

      dots.forEach(function (dot, j) {
        dot.classList.toggle("is-active", j === i);
        dot.classList.toggle("is-climax", j === i && !!e.climax);
      });
    }

    var timer = null;
    function detener() { if (timer) { clearInterval(timer); timer = null; } }
    function iniciar() {
      if (reduceMotion || timer) return;
      timer = setInterval(function () {
        irAEtapa((indice + 1) % ETAPAS.length, false);
      }, AUTOPLAY_MS);
    }

    function irAEtapa(i, manual) {
      indice = i;
      aplicarEtapa(indice);
      if (manual) { detener(); iniciar(); }
    }

    prevBtn.addEventListener("click", function () {
      irAEtapa((indice - 1 + ETAPAS.length) % ETAPAS.length, true);
    });
    nextBtn.addEventListener("click", function () {
      irAEtapa((indice + 1) % ETAPAS.length, true);
    });

    card.addEventListener("mouseenter", detener);
    card.addEventListener("mouseleave", iniciar);

    aplicarEtapa(0);

    if ("IntersectionObserver" in window) {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) iniciar(); else detener();
        });
      }, { threshold: 0.3 });
      observer.observe(card);
    } else {
      iniciar();
    }
  })();
</script>
<script>
  (function () {
    var pbSlug = "03-flashover";
    function reportHeight() {
      var h = Math.ceil(document.body.getBoundingClientRect().height);
      window.parent.postMessage({ source: "pb-anim", slug: pbSlug, height: h }, "*");
    }
    if (document.readyState === "complete") {
      reportHeight();
    } else {
      window.addEventListener("load", reportHeight);
    }
    window.addEventListener("resize", reportHeight);
    if (window.ResizeObserver) {
      new ResizeObserver(reportHeight).observe(document.body);
    }
  })();
</script>
</body>
