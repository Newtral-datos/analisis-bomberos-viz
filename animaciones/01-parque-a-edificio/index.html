<style>
  .pb-anim {
    --pb-accent: #01f3b3;
    --pb-ink: #1f2d2a;
    --pb-muted: #6b7a75;
    box-sizing: border-box;
    max-width: 560px;
    margin: 0 auto;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .pb-anim * { box-sizing: border-box; }

  .pb-anim__card {
    position: relative;
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    border-radius: 18px;
    padding: 26px 28px 22px;
    background: #ffffff;
    border: none;
    box-shadow: none;
    color: var(--pb-ink);
  }

  .pb-anim__eyebrow {
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--pb-muted);
  }
  .pb-anim__rule {
    width: 22px;
    height: 3px;
    border-radius: 2px;
    background: var(--pb-accent);
    display: inline-block;
  }

  .pb-anim__scenebox {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    width: 100%;
  }

  .pb-anim__scene {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .pb-roadline {
    animation: pbDash 1s linear infinite;
  }

  .pb-beacon {
    animation: pbBlink 1s ease-in-out infinite;
  }

  .pb-flag {
    animation: pbFlag 2.2s ease-in-out infinite;
  }

  .pb-sky-a { animation: pbDriftA 16s ease-in-out infinite; }
  .pb-sky-b { animation: pbDriftB 20s ease-in-out infinite; }

  .pb-fire { animation: pbFlicker 0.55s ease-in-out infinite; }
  .pb-fire-b { animation-duration: 0.7s; animation-delay: 0.12s; }

  .pb-fire-glow { animation: pbGlow 1.8s ease-in-out infinite; }
  .pb-fire-window-glow { animation: pbGlow 1.1s ease-in-out infinite; }

  .pb-smoke { opacity: 0; }
  .pb-smoke-1 { animation: pbSmoke 3s ease-out infinite 0s; }
  .pb-smoke-2 { animation: pbSmoke 3s ease-out infinite 1s; }
  .pb-smoke-3 { animation: pbSmoke 3s ease-out infinite 2s; }

  .pb-truck-drive {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: pbDrive 7s cubic-bezier(0.47, 0, 0.53, 1) infinite;
  }

  .pb-truck-bounce {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: pbBounce 0.5s ease-in-out infinite;
  }

  .pb-wheel {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: pbSpin 0.5s linear infinite;
  }

  .pb-light-a { animation: pbBlink 0.4s steps(1) infinite; }
  .pb-light-b { animation: pbBlink 0.4s steps(1) infinite 0.2s; }

  .pb-puff { opacity: 0; }
  .pb-puff-1 { animation: pbPuff 1.4s ease-out infinite 0s; }
  .pb-puff-2 { animation: pbPuff 1.4s ease-out infinite 0.45s; }
  .pb-puff-3 { animation: pbPuff 1.4s ease-out infinite 0.9s; }

  .pb-anim__stats {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    margin-top: 14px;
    padding-top: 18px;
    border-top: 1px solid #edf1f0;
  }

  .pb-anim__stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 130px;
  }

  .pb-anim__value {
    font-size: 36px;
    font-weight: 700;
    color: var(--pb-accent);
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  .pb-anim__statlabel {
    margin-top: 5px;
    font-size: 12.5px;
    color: var(--pb-muted);
    text-align: center;
  }

  .pb-anim__divider {
    width: 1px;
    height: 38px;
    background: #e3e8e6;
  }

  .pb-anim__footnote {
    margin: 16px 0 0;
    font-size: 8.5px;
    color: var(--pb-muted);
    text-align: center;
    opacity: 0.85;
  }

  @keyframes pbDash {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: -30; }
  }

  @keyframes pbDrive {
    0%   { transform: translateX(0px) scaleX(1); }
    46%  { transform: translateX(397px) scaleX(1); }
    50%  { transform: translateX(397px) scaleX(-1); }
    96%  { transform: translateX(0px) scaleX(-1); }
    100% { transform: translateX(0px) scaleX(1); }
  }

  @keyframes pbBounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-1.6px) rotate(-0.6deg); }
  }

  @keyframes pbSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  @keyframes pbBlink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.15; }
  }

  @keyframes pbFlag {
    0%, 100% { transform: skewY(0deg) rotate(0deg); }
    50% { transform: skewY(-6deg) rotate(-3deg); }
  }

  @keyframes pbDriftA {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(14px); }
  }
  @keyframes pbDriftB {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(-12px); }
  }

  @keyframes pbPuff {
    0%   { opacity: 0.45; transform: translate(0, 0) scale(0.4); }
    100% { opacity: 0; transform: translate(-16px, -14px) scale(1.6); }
  }

  @keyframes pbFlicker {
    0%, 100% { transform: scaleY(1) scaleX(1) rotate(0deg); }
    50% { transform: scaleY(1.1) scaleX(0.94) rotate(-2deg); }
  }

  @keyframes pbGlow {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 0.9; }
  }

  @keyframes pbSmoke {
    0%   { opacity: 0.35; transform: translate(0, 0) scale(0.6); }
    100% { opacity: 0; transform: translate(10px, -38px) scale(2.1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .pb-roadline, .pb-beacon, .pb-flag, .pb-sky-a, .pb-sky-b,
    .pb-truck-drive, .pb-truck-bounce, .pb-wheel,
    .pb-light-a, .pb-light-b, .pb-puff-1, .pb-puff-2, .pb-puff-3,
    .pb-fire, .pb-fire-glow, .pb-fire-window-glow,
    .pb-smoke-1, .pb-smoke-2, .pb-smoke-3 {
      animation: none;
    }
  }

  @media (max-width: 480px) {
    .pb-anim__value { font-size: 28px; }
    .pb-anim__stats { gap: 20px; }
    .pb-anim__card { padding: 20px 16px 18px; }
  }
</style>

<script>
  (function () {
    // Debe coincidir con la duracion y los puntos de corte (%) del keyframe
    // CSS "pbDrive" que mueve al camion, para que las cifras avancen al mismo
    // ritmo exacto que el camion recorre la carretera.
    var DRIVE_DURATION_MS = 7000;
    var FORWARD_END = 0.46;
    var FLIP_OUT_END = 0.50;
    var RETURN_END = 0.96;

    var reduceMotion = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function ease(t) {
      return t * t * (3 - 2 * t);
    }

    function driveFraction(phase) {
      if (phase < FORWARD_END) return ease(phase / FORWARD_END);
      if (phase < FLIP_OUT_END) return 1;
      if (phase < RETURN_END) return ease(1 - (phase - FLIP_OUT_END) / (RETURN_END - FLIP_OUT_END));
      return 0;
    }

    function formatEs(value, decimals) {
      return value.toFixed(decimals).replace(".", ",");
    }

    var startTime = performance.now();

    var cards = document.querySelectorAll(".pb-anim__card");
    cards.forEach(function (card) {
      var values = Array.prototype.map.call(card.querySelectorAll(".pb-anim__value"), function (el) {
        return {
          el: el,
          target: parseFloat(el.getAttribute("data-target")),
          decimals: parseInt(el.getAttribute("data-decimals"), 10) || 0,
          suffix: el.getAttribute("data-suffix") || ""
        };
      });

      if (reduceMotion) {
        values.forEach(function (v) {
          v.el.textContent = formatEs(v.target, v.decimals) + v.suffix;
        });
        return;
      }

      var running = false;
      var rafId = null;

      function frame(now) {
        var elapsed = now - startTime;
        var phase = (elapsed % DRIVE_DURATION_MS) / DRIVE_DURATION_MS;
        var fraction = driveFraction(phase);
        values.forEach(function (v) {
          v.el.textContent = formatEs(v.target * fraction, v.decimals) + v.suffix;
        });
        if (running) rafId = requestAnimationFrame(frame);
      }

      function start() {
        if (running) return;
        running = true;
        rafId = requestAnimationFrame(frame);
      }
      function stop() {
        running = false;
        if (rafId) cancelAnimationFrame(rafId);
      }

      if ("IntersectionObserver" in window) {
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) start(); else stop();
          });
        }, { threshold: 0.3 });
        observer.observe(card);
      } else {
        start();
      }
    });
  })();
</script>
</body>
</html>
